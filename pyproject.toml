[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "akane-plugin"
version = "0.14.2"
description = "Public plugin contracts, tools, scoped events and versioned services for Akane"
readme = "akane_plugin/README.md"
requires-python = ">=3.11"
dependencies = ["capcore>=0.1.3,<0.2"]

[tool.setuptools]
packages = ["akane_plugin"]
include-package-data = false

[tool.setuptools.package-data]
akane_plugin = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  ".venv",
  "local_research",
  "runtime_logs",
  "users_data",
]

[tool.ruff.lint]
# Start with correctness-focused rules so the Alpha CI can protect new changes
# without forcing a repository-wide style rewrite.
select = ["E9", "F63", "F7", "F82"]
