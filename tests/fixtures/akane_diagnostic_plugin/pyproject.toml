[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akane-diagnostic-plugin"
version = "0.1.0"
description = "Side-effect-free M65-C plugin host acceptance fixture."
requires-python = ">=3.11"

[project.entry-points."akane.plugins.v1"]
"akane.test.diagnostic" = "akane_diagnostic_plugin:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
