[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akane-tts"
version = "0.1.0"
description = "Public TTS service using the independent speech adapter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["akane-plugin>=0.14,<0.15", "capcore-adapter-speech[edge]>=0.1,<0.2"]

[project.entry-points."akane.plugins.v1"]
"akane.tts" = "akane_tts.plugin:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
