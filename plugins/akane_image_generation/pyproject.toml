[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akane-image-generation"
version = "0.1.0"
description = "Bounded image generation and reference editing business runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "urllib3>=2.2,<3", "Pillow>=10,<13"]

[tool.setuptools.packages.find]
where = ["src"]
