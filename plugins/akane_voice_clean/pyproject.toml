[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akane-voice-clean"
version = "0.1.0"
description = "Offline voice cleaning business runtime for Akane"
readme = "README.md"
requires-python = ">=3.11"

[project.entry-points."akane.plugins.v1"]
"akane.voice-clean" = "akane_voice_clean.plugin:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
