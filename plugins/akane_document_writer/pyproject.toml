[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akane-document-writer"
version = "0.1.0"
description = "Independent document rendering and non-destructive styling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-docx>=1.1,<2", "openpyxl>=3.1,<4", "reportlab>=4.2,<5"]

[project.entry-points."akane.plugins.v1"]
"akane.document-writer" = "akane_document_writer.plugin:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
