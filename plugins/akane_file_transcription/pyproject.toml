[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akane-file-transcription"
version = "0.1.0"
description = "Offline file transcription business runtime for Akane"
readme = "README.md"
requires-python = ">=3.11"

[project.entry-points."akane.plugins.v1"]
"akane.file-transcription" = "akane_file_transcription.plugin:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
