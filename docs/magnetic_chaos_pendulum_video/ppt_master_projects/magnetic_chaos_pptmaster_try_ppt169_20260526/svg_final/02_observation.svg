<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC" />

  <g id="header">
    <path fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" d="M88,42 H1192 A24,24 0 0 1 1216,66 V126 A24,24 0 0 1 1192,150 H88 A24,24 0 0 1 64,126 V66 A24,24 0 0 1 88,42 Z" />
    <text x="96" y="96" font-family="Microsoft YaHei" font-size="50px" font-weight="700" fill="#1A202C">先看现象：运动很复杂</text>
    <text x="98" y="132" font-family="Microsoft YaHei" font-size="24px" fill="#526070">普通单摆轨迹比较规则，磁混沌摆会不断弯曲、折返和改变方向。</text>
  </g>

  <g id="trajectory-panel">
    <path fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" d="M88,182 H644 A24,24 0 0 1 668,206 V590 A24,24 0 0 1 644,614 H88 A24,24 0 0 1 64,590 V206 A24,24 0 0 1 88,182 Z" />
    <path fill="#EEF6FF" d="M108,204 H624 A20,20 0 0 1 644,224 V234 A20,20 0 0 1 624,254 H108 A20,20 0 0 1 88,234 V224 A20,20 0 0 1 108,204 Z" />
    <text x="366" y="237" text-anchor="middle" font-family="Microsoft YaHei" font-size="24px" font-weight="700" fill="#2563EB">轨迹示意：不是固定圆弧</text>
    <circle cx="366" cy="410" r="160" fill="#EEF6FF" stroke="#D9E2EC" stroke-width="3" />
    <circle cx="366" cy="286" r="32" fill="#FFFFFF" stroke="#2563EB" stroke-width="4" />
    <text x="366" y="296" text-anchor="middle" font-family="Microsoft YaHei" font-size="24px" font-weight="700" fill="#2563EB">N</text>
    <circle cx="242" cy="500" r="32" fill="#FFFFFF" stroke="#0D9488" stroke-width="4" />
    <text x="242" y="510" text-anchor="middle" font-family="Microsoft YaHei" font-size="24px" font-weight="700" fill="#0D9488">N</text>
    <circle cx="494" cy="500" r="32" fill="#FFFFFF" stroke="#EA580C" stroke-width="4" />
    <text x="494" y="510" text-anchor="middle" font-family="Microsoft YaHei" font-size="24px" font-weight="700" fill="#EA580C">S</text>
    <path d="M300 358 C226 286 286 224 366 286 C462 356 528 320 508 408 C486 514 356 552 242 500 C150 456 202 358 300 358" fill="none" stroke="#7C3AED" stroke-width="6" />
    <path d="M300 358 C386 392 448 438 494 500" fill="none" stroke="#EA580C" stroke-width="5" stroke-dasharray="10 12" />
    <circle cx="300" cy="358" r="22" fill="#FACC15" stroke="#EA580C" stroke-width="4" />
  </g>

  <g id="observation-cards">
    <path fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" d="M738,182 H1194 A22,22 0 0 1 1216,204 V272 A22,22 0 0 1 1194,294 H738 A22,22 0 0 1 716,272 V204 A22,22 0 0 1 738,182 Z" />
    <path fill="#2563EB" d="M747,210 H747 A7,7 0 0 1 754,217 V261 A7,7 0 0 1 747,268 H747 A7,7 0 0 1 740,261 V217 A7,7 0 0 1 747,210 Z" />
    <text x="782" y="226" font-family="Microsoft YaHei" font-size="28px" font-weight="700" fill="#2563EB">1. 方向不断改变</text>
    <text x="782" y="266" font-family="Microsoft YaHei" font-size="24px" fill="#1A202C">靠近一个磁铁后又绕开。</text>

    <path fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" d="M738,326 H1194 A22,22 0 0 1 1216,348 V416 A22,22 0 0 1 1194,438 H738 A22,22 0 0 1 716,416 V348 A22,22 0 0 1 738,326 Z" />
    <path fill="#0D9488" d="M747,354 H747 A7,7 0 0 1 754,361 V405 A7,7 0 0 1 747,412 H747 A7,7 0 0 1 740,405 V361 A7,7 0 0 1 747,354 Z" />
    <text x="782" y="370" font-family="Microsoft YaHei" font-size="28px" font-weight="700" fill="#0D9488">2. 运动逐渐变慢</text>
    <text x="782" y="410" font-family="Microsoft YaHei" font-size="24px" fill="#1A202C">阻力和摩擦消耗能量。</text>

    <path fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" d="M738,470 H1194 A22,22 0 0 1 1216,492 V560 A22,22 0 0 1 1194,582 H738 A22,22 0 0 1 716,560 V492 A22,22 0 0 1 738,470 Z" />
    <path fill="#EA580C" d="M747,498 H747 A7,7 0 0 1 754,505 V549 A7,7 0 0 1 747,556 H747 A7,7 0 0 1 740,549 V505 A7,7 0 0 1 747,498 Z" />
    <text x="782" y="514" font-family="Microsoft YaHei" font-size="28px" font-weight="700" fill="#EA580C">3. 最后停在磁铁上方</text>
    <text x="782" y="554" font-family="Microsoft YaHei" font-size="24px" fill="#1A202C">结局和释放条件有关。</text>
  </g>

  <g id="footer">
    <path fill="#EEF6FF" stroke="#CBD5E1" stroke-width="2" d="M82,638 H552 A18,18 0 0 1 570,656 V656 A18,18 0 0 1 552,674 H82 A18,18 0 0 1 64,656 V656 A18,18 0 0 1 82,638 Z" />
    <text x="92" y="663" font-family="Microsoft YaHei" font-size="18px" fill="#64748B">下一步：观看释放后的初始运动。</text>
    <text x="1216" y="664" text-anchor="end" font-family="Microsoft YaHei" font-size="16px" fill="#64748B">02 / 07</text>
  </g>
