<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC" />

  <g id="left-narration">
    <path fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" d="M92,56 H396 A28,28 0 0 1 424,84 V636 A28,28 0 0 1 396,664 H92 A28,28 0 0 1 64,636 V84 A28,28 0 0 1 92,56 Z" />
    <text x="96" y="116" font-family="Microsoft YaHei" font-size="40px" font-weight="700" fill="#1A202C">演示片段一</text>
    <text x="96" y="158" font-family="Microsoft YaHei" font-size="28px" font-weight="700" fill="#2563EB">释放与初始摆动</text>
    <line x1="96" y1="188" x2="360" y2="188" stroke="#D9E2EC" stroke-width="3" />

    <circle cx="112" cy="248" r="14" fill="#2563EB" />
    <text x="140" y="256" font-family="Microsoft YaHei" font-size="24px" fill="#1A202C">观察起点</text>
    <text x="140" y="288" font-family="Microsoft YaHei" font-size="18px" fill="#526070">小球从偏离中心处释放</text>

    <circle cx="112" cy="352" r="14" fill="#0D9488" />
    <text x="140" y="360" font-family="Microsoft YaHei" font-size="24px" fill="#1A202C">观察转向</text>
    <text x="140" y="392" font-family="Microsoft YaHei" font-size="18px" fill="#526070">靠近磁铁后轨迹改变</text>

    <circle cx="112" cy="456" r="14" fill="#EA580C" />
    <text x="140" y="464" font-family="Microsoft YaHei" font-size="24px" fill="#1A202C">观察特点</text>
    <text x="140" y="496" font-family="Microsoft YaHei" font-size="18px" fill="#526070">运动不再是简单圆弧</text>

    <path fill="#EEF6FF" stroke="#CBD5E1" stroke-width="2" d="M125,560 H331 A29,29 0 0 1 360,589 V589 A29,29 0 0 1 331,618 H125 A29,29 0 0 1 96,589 V589 A29,29 0 0 1 125,560 Z" />
    <text x="228" y="597" text-anchor="middle" font-family="Microsoft YaHei" font-size="24px" font-weight="700" fill="#2563EB">从规则到复杂</text>
  </g>

  <g id="video-placeholder">
    <path fill="#FFFFFF" stroke="#EA580C" stroke-width="5" stroke-dasharray="20 14" d="M496,72 H1188 A28,28 0 0 1 1216,100 V584 A28,28 0 0 1 1188,612 H496 A28,28 0 0 1 468,584 V100 A28,28 0 0 1 496,72 Z" />
    <path fill="#EEF6FF" stroke="#CBD5E1" stroke-width="3" d="M520,110 H1164 A18,18 0 0 1 1182,128 V475 A18,18 0 0 1 1164,493 H520 A18,18 0 0 1 502,475 V128 A18,18 0 0 1 520,110 Z" />
    <polygon points="812,258 812,345 892,302" fill="#EA580C" />
    <text x="842" y="414" text-anchor="middle" font-family="Microsoft YaHei" font-size="40px" font-weight="700" fill="#1A202C">实验演示片段一</text>
    <text x="842" y="462" text-anchor="middle" font-family="Microsoft YaHei" font-size="24px" fill="#526070">释放小球，观察初始复杂运动</text>
    <path fill="#EEF6FF" stroke="#CBD5E1" stroke-width="2" d="M587,526 H1097 A21,21 0 0 1 1118,547 V547 A21,21 0 0 1 1097,568 H587 A21,21 0 0 1 566,547 V547 A21,21 0 0 1 587,526 Z" />
    <text x="842" y="554" text-anchor="middle" font-family="Microsoft YaHei" font-size="18px" fill="#64748B">视频时长约 20 到 25 秒</text>
