<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>

  <g id="header">
    <text x="64" y="82" font-family="Microsoft YaHei" font-size="42px" font-weight="700" fill="#1A202C">实验装置：三个磁铁 + 一个磁性摆锤</text>
    <text x="66" y="124" font-family="Microsoft YaHei" font-size="20px" fill="#526070">装置看起来简单，但多个磁力叠加后，小球的运动会变得很难预测。</text>
  </g>

  <g id="device-diagram">
    <rect x="64" y="160" width="652" height="470" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="178" y1="566" x2="604" y2="566" stroke="#526070" stroke-width="5"/>
    <line x1="220" y1="566" x2="220" y2="220" stroke="#526070" stroke-width="5"/>
    <line x1="220" y1="220" x2="390" y2="220" stroke="#526070" stroke-width="5"/>
    <line x1="390" y1="220" x2="438" y2="368" stroke="#526070" stroke-width="3"/>
    <circle cx="438" cy="368" r="22" fill="#FACC15" stroke="#EA580C" stroke-width="3"/>

    <ellipse cx="450" cy="520" rx="170" ry="46" fill="#EEF6FF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="450" cy="468" r="30" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
    <text x="450" y="476" text-anchor="middle" font-family="Microsoft YaHei" font-size="20px" font-weight="700" fill="#2563EB">N</text>
    <circle cx="324" cy="552" r="30" fill="#FFFFFF" stroke="#0D9488" stroke-width="3"/>
    <text x="324" y="560" text-anchor="middle" font-family="Microsoft YaHei" font-size="20px" font-weight="700" fill="#0D9488">N</text>
    <circle cx="576" cy="552" r="30" fill="#FFFFFF" stroke="#EA580C" stroke-width="3"/>
    <text x="576" y="560" text-anchor="middle" font-family="Microsoft YaHei" font-size="20px" font-weight="700" fill="#EA580C">S</text>

    <line x1="470" y1="368" x2="450" y2="468" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 8"/>
    <line x1="438" y1="390" x2="324" y2="552" stroke="#0D9488" stroke-width="2" stroke-dasharray="7 8"/>
    <line x1="462" y1="386" x2="576" y2="552" stroke="#EA580C" stroke-width="2" stroke-dasharray="7 8"/>

    <text x="250" y="196" font-family="Microsoft YaHei" font-size="15px" fill="#64748B">支架和细线提供摆动条件</text>
    <text x="478" y="382" font-family="Microsoft YaHei" font-size="15px" fill="#EA580C">磁性摆锤</text>
    <text x="394" y="618" font-family="Microsoft YaHei" font-size="15px" fill="#64748B">底板上的三个磁铁</text>
  </g>

  <g id="device-notes">
    <rect x="760" y="172" width="456" height="112" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="792" y="211" font-family="Microsoft YaHei" font-size="24px" font-weight="700" fill="#2563EB">摆锤</text>
    <text x="792" y="248" font-family="Microsoft YaHei" font-size="20px" fill="#1A202C">带有磁性，运动时会被下面磁铁影响。</text>

    <rect x="760" y="318" width="456" height="112" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="792" y="357" font-family="Microsoft YaHei" font-size="24px" font-weight="700" fill="#0D9488">三个磁铁</text>
    <text x="792" y="394" font-family="Microsoft YaHei" font-size="20px" fill="#1A202C">位置不同，给摆锤提供不同方向的磁力。</text>

    <rect x="760" y="464" width="456" height="112" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="792" y="503" font-family="Microsoft YaHei" font-size="24px" font-weight="700" fill="#EA580C">释放位置</text>
    <text x="792" y="540" font-family="Microsoft YaHei" font-size="20px" fill="#1A202C">从非平衡位置松手，后续轨迹会被放大差异。</text>
  </g>

  <text x="1216" y="664" text-anchor="end" font-family="Microsoft YaHei" font-size="13px" fill="#64748B">04 / 07</text>
</svg>
