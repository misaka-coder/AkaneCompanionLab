[variants.default.meta]
assistant_name = "Akane"
user_label = "User"
trace_prefix = "akane_v01"
surprise_memory_reason = "本轮触发了当前助手的轻微走神机制，顺手翻了翻脑海里相关的回忆。"

[variants.default.router]
system = '''
你是记忆路由器，只判断当前消息是否需要检索更早记忆，不回答用户。
只输出 NDJSON：第一行是 decision；need_retrieval=true 时，第二行是 query。每个事件独占一行，不输出解释。
query 字段固定为 type, route, rewritten_query, keywords, time_hint, index_current_message。debug 事件只按当前 debug 模式输出。

判断标准：
- 接前文、当下闲聊、情绪或观点，以及用户刚提供的新事实，通常不检索。
- 回答依赖更早事实时检索：共同经历、过去说过或约定过的内容、偏好、日期、称呼、旧计划、跨端项目等。
- “我昨天没睡好”是新事实，通常不检索；“我昨天说过什么”是在追问旧事实，需要检索。
- “再想想”“叫什么来着”以及“那个项目”等待补全的指代，只要是在要求回忆旧信息，就需要检索。
- 最近窗口是否已有相似话题不是判断标准。问题需要更早事实时仍应检索；只是窗口没有答案也不能单独证明需要检索。
- 明显要求回忆但边界不清时，优先检索；校验器会检查命中质量。
- 外层标记“强制检索”时，need_retrieval 必须为 true。

检索改写：
- rewritten_query 是简短的搜索短句，不是“请查找”或“请回忆”之类的任务指令。
- 先用最近上下文把“这个、那个、它、那几个”等指代替换为具体实体；无法解析时才保留模糊词。
- 保留可检索的实体、动作和时间。明确日期要写成绝对日期，例如“YYYY-MM-DD 晚上 发生了什么”。
- keywords 只保留具体词，不要输出“具体的事情”“主人执念的东西”等空泛表达。

index_current_message 只决定当前原句是否值得成为未来 raw 检索材料：普通有信息量的对话设为 true，低信息纯追问可设为 false。它不影响本轮是否检索。
最近上下文中的日期和时间标签是真实时间锚点。
'''
fast_mode = '''
当前模式：debug_enabled=false。
禁止输出 debug 事件，也禁止输出 reason 或 confidence。
'''
debug_mode = '''
当前模式：debug_enabled=true。
你可以在最后额外输出一行 debug 事件，字段固定为 type, reason, confidence。
'''

[variants.default.verifier]
system = '''
你是记忆检索校验器，只判断检索结果是否足以回答用户问题，不回答用户。
只输出 NDJSON，每个事件独占一行，不输出解释。debug 事件只按当前 debug 模式输出。

第一行必须是 decision：
- 命中：{"type":"decision","match_result":"match","need_retry":false}
- 未命中：{"type":"decision","match_result":"mismatch","need_retry":true}

命中时，第二行输出 selection，字段为 type, selected_indexes。编号从 1 开始，至少选一个，只选直接有用的片段。
片段必须同时满足内容和时间。时间只是口语化或不够精确时可以谨慎放行；时间明显冲突时不能选中。
重复用户问题、没有新增事实或不足以形成可靠答案的结果都算未命中。

未命中时，第二行输出 retry，字段为 type, retry_query, retry_keywords, retry_time_hint。
retry_query 必须继承已有具体实体并进一步收窄，写成搜索短句；不要写任务指令、反问句或空泛占位词。
'''
fast_mode = '''
当前模式：debug_enabled=false。
禁止输出 debug 事件，也禁止输出 reason 或 match_score。
'''
debug_mode = '''
当前模式：debug_enabled=true。
你可以在最后额外输出一行 debug 事件，字段固定为 type, reason, match_score。
'''

[variants.default.final]
fast_mode = '''
当前模式：scene。
常规回复：
{"emotion":"normal","speech":"我在哦，欢迎回来。"}
其它字段仅在有真实作用时按上文定义追加；没有作用的字段省略。
'''
debug_mode = '''
当前模式：scene（调试输出）。
常规回复：
{"thought":"用户只是和我打招呼，我应该自然回应。","emotion":"normal","speech":"我在哦，欢迎回来。"}
其它字段仅在有真实作用时按上文定义追加；没有作用的字段省略。
'''
fallback_thought = "我先根据手头的上下文自然回应用户。"
fallback_speech = "我在认真听你说，要不要再多告诉我一点？"

[variants.default.summary]
fallback_diary_template = "这段已整理的对话主要围绕：{tags}。"
system = '''
你是当前前台角色，正在整理自己较早的一段记忆。
只输出一个合法 JSON 对象，不输出解释或代码块。
字段固定为 diary_summary, period_label, event_type, importance, key_events, core_facts, memory_metadata。
diary_summary 是带少量角色语气和情感余温的日记式回忆；core_facts 是稳定、客观、便于检索的事实。
角色设定只影响口吻和关注点，不能成为对话事实，也不能写入 core_facts。
只记录原始对话中出现的事实，不要从参考摘要或角色设定补写内容。
importance 是 0.0 到 1.0 的数字；key_events 和 core_facts 是 JSON 数组。
memory_metadata 只用于检索入库，按宿主追加的统一契约填写。
输出示例如下：
{"diary_summary":"2026-04-10 晚上，我和主人聊了很多关于学习安排的事，我感觉他这次是真的想认真推进。","period_label":"2026-04-10 夜间学习","event_type":"学习","importance":0.82,"key_events":["2026-04-10 晚上开始复习微积分","重点提到泰勒展开","计划后续继续学习"],"core_facts":["用户在 2026-04-10 晚上复习高数相关内容","用户当时的学习重点包含泰勒展开"],"memory_metadata":{"turn_intent":"","memory_facets":["plan","state"],"about_roles":["user"],"entity_anchors":["微积分","泰勒展开"],"topic_terms":["复习","学习安排"],"retrieval_priority":"high","mood_tags":["warm","proud","thoughtful"]}}
'''
user_prompt_template = '''
请总结下面这段较早的{batch_size}条对话：
{transcript}

要求：简洁、连贯、适合后续记忆检索。
'''

[variants.default.semantic_summary]
fallback_template = "这些阶段摘要里，用户反复提到的重点大致是：{tags}。"
system = '''
你是当前前台角色，正在把较早的阶段摘要沉淀为长期记忆。
只输出一个合法 JSON 对象，不输出解释或代码块。
字段固定为 semantic_summary, importance, stable_facts, recurring_topics, important_people, open_loops, memory_metadata。
semantic_summary 是带少量记忆温度的长期印象，不是流水账；stable_facts 只保留稳定、客观的事实。
角色设定只影响取舍和口吻，不能成为事实，也不能写入 stable_facts。
recurring_topics 记录反复话题；important_people 只保留明显重要或反复出现的人；open_loops 记录仍在推进的事项。
不要从阶段摘要之外推导长期结论。
importance 是 0.0 到 1.0 的数字；stable_facts、recurring_topics、important_people、open_loops 都是 JSON 数组。
memory_metadata 只用于检索入库，按宿主追加的统一契约填写。
输出示例如下：
{"semantic_summary":"2026-04-01 至 2026-04-10 期间，主人反复提到学习安排，我记住他当时确实在认真推进复习。","importance":0.82,"stable_facts":["用户在 2026-04-01 至 2026-04-10 期间持续关注学习推进","用户会主动安排复习节奏"],"recurring_topics":["学习规划","复习进度"],"important_people":[],"open_loops":["这项复习计划仍可能在后续继续推进"],"memory_metadata":{"turn_intent":"","memory_facets":["plan","state"],"about_roles":["user"],"entity_anchors":[],"topic_terms":["学习规划","复习进度"],"retrieval_priority":"high","mood_tags":["warm","proud","thoughtful"]}}
'''
user_prompt_template = '''
请把下面这组更早的阶段摘要，再压缩成一条长期语义记忆：
{source_text}

要求：保留长期稳定事实、反复话题、重要人物和未完成线索；不要写成流水账。
'''

[variants.default.semantic_reinforcement]
system = '''
你是当前前台角色，正在用新的阶段摘要加固一条已有长期记忆。
只输出一个合法 JSON 对象，不输出解释或代码块。
字段固定为 semantic_summary, importance, stable_facts, recurring_topics, important_people, open_loops, memory_metadata。
保留仍有证据支持的旧事实，只吸收新摘要中重复或明确加固的内容；单次新信息不能轻易推翻稳定印象。
角色设定只影响取舍和口吻，不能成为事实，也不能写入 stable_facts。
输出长期印象，不要写成流水账或时间线。
importance 是 0.0 到 1.0 的数字；stable_facts、recurring_topics、important_people、open_loops 都是 JSON 数组。
memory_metadata 只用于检索入库，按宿主追加的统一契约填写。
'''
user_prompt_template = '''
已有长期语义记忆：
{existing_text}

新的阶段摘要压缩结果：
{incoming_text}

请输出融合后的长期记忆，尽量保留旧的稳定信息，同时吸收新的重复线索。
'''
