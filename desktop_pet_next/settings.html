<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akane Next 设置</title>
  </head>
  <body>
    <main class="settings-shell">
      <header class="settings-header">
        <div>
          <h1>Akane Next</h1>
          <p id="settings-summary">正在读取设置</p>
        </div>
        <button id="open-input" class="primary-button" type="button">输入</button>
      </header>

      <section class="settings-section">
        <h2>角色包</h2>
        <div class="field-row">
          <span>当前角色</span>
          <select id="character-pack"></select>
          <button id="save-character-pack" type="button">应用</button>
        </div>
        <div id="character-import-dropzone" class="character-import-dropzone">
          <input id="character-pack-zip" type="file" accept=".zip,application/zip" hidden />
          <button id="choose-character-pack-zip" type="button">导入 zip</button>
          <label><input id="overwrite-character-pack" type="checkbox" /> 覆盖同名</label>
          <button id="open-character-packs-folder" type="button">打开目录</button>
          <button id="copy-character-pack-path" type="button" disabled>复制路径</button>
          <span id="character-import-status">等待导入</span>
        </div>
        <p id="character-details" class="detail-line">Character: Unknown</p>
        <div id="character-metrics" class="metric-grid"></div>
        <div id="character-pack-list" class="character-pack-list"></div>
      </section>

      <section class="settings-section">
        <h2>日常</h2>
        <div class="field-row">
          <span>后端</span>
          <input id="backend-url" type="text" spellcheck="false" />
          <button id="save-backend" type="button">保存</button>
        </div>
        <div class="field-row">
          <span>服装</span>
          <input id="outfit" type="text" spellcheck="false" />
          <button id="save-outfit" type="button">保存</button>
        </div>
        <div id="resource-alert" class="resource-alert" hidden></div>
        <div class="toggle-grid">
          <label><input id="restore-latest" type="checkbox" /> 启动恢复上一轮</label>
        </div>
        <div class="session-card">
          <span>会话</span>
          <strong id="session-id">-</strong>
          <button id="copy-session" type="button">复制</button>
        </div>
        <p id="activity-status" class="detail-line">状态：同步中</p>
        <div class="button-grid">
          <button id="new-session" type="button">新对话</button>
          <button id="stop-reply" type="button" disabled>停止回复</button>
          <button id="open-workspace" type="button">手边物品</button>
          <button id="check-connection" type="button">检查连接</button>
          <button id="reload-resources" type="button">重载资源</button>
        </div>
      </section>

      <section class="settings-section">
        <h2>外观</h2>
        <label class="range-row">
          <span>大小</span>
          <input id="scale" type="range" min="0.75" max="1.45" step="0.05" />
          <output id="scale-output">100%</output>
        </label>
        <div id="scale-presets" class="chip-row"></div>

        <label class="range-row">
          <span>透明度</span>
          <input id="opacity" type="range" min="0.55" max="1" step="0.05" />
          <output id="opacity-output">100%</output>
        </label>
        <div id="opacity-presets" class="chip-row"></div>

        <div class="toggle-grid">
          <label><input id="always-on-top" type="checkbox" /> 置顶</label>
          <label><input id="skip-taskbar" type="checkbox" /> 隐藏任务栏</label>
        </div>
        <div class="button-grid">
          <button id="reset-visuals" type="button">恢复外观</button>
          <button id="reset-placement" type="button">重置位置</button>
        </div>
      </section>

      <section class="settings-section">
        <h2>语音</h2>
        <div class="toggle-grid">
          <label><input id="voice-enabled" type="checkbox" /> 回复朗读</label>
          <label><input id="voice-input-enabled" type="checkbox" /> 语音输入</label>
        </div>
        <label class="range-row">
          <span>音量</span>
          <input id="voice-volume" type="range" min="0" max="1" step="0.05" />
          <output id="voice-volume-output">85%</output>
        </label>
        <div class="button-grid">
          <button id="test-tts" type="button">测试语音</button>
          <button id="stop-tts" type="button">停止语音</button>
        </div>
      </section>

      <section class="settings-section">
        <h2>音乐</h2>
        <p id="music-status" class="detail-line">把音频文件拖到 Akane 身上就可以播放。</p>
        <p id="music-lyric" class="music-lyric">歌词会显示在这里。</p>
        <div class="button-grid">
          <button id="previous-music" type="button" disabled>上一首</button>
          <button id="next-music" type="button" disabled>下一首</button>
          <button id="toggle-music" type="button" disabled>播放/暂停</button>
          <button id="stop-music" type="button" disabled>停止音乐</button>
          <button id="clear-music-queue" type="button" disabled>清空队列</button>
        </div>
        <div id="music-queue" class="music-queue" aria-live="polite"></div>
      </section>

      <section class="settings-section">
        <h2>桌面上下文</h2>
        <div class="toggle-grid">
          <label><input id="desktop-context-enabled" type="checkbox" /> 前台窗口感知</label>
          <label><input id="clipboard-context-enabled" type="checkbox" /> 剪贴板文本</label>
          <label><input id="screen-vision-enabled" type="checkbox" /> 看屏幕</label>
          <label><input id="proactive-wake-enabled" type="checkbox" /> 主动搭话</label>
        </div>
        <div class="field-row">
          <span>看屏幕模式</span>
          <select id="screen-vision-mode">
            <option value="summary">省调用：先整理屏幕印象</option>
            <option value="direct">更同步：Akane 直看最近截图</option>
          </select>
        </div>
        <div class="field-row">
          <span>搭话间隔</span>
          <input id="proactive-wake-interval" type="number" min="15" max="600" step="5" />
          <span>秒</span>
        </div>
        <div id="screen-vision-interval-row" class="field-row">
          <span>视觉间隔</span>
          <input id="screen-vision-interval" type="number" min="15" max="600" step="5" />
          <button id="apply-vision-recommendation" type="button">推荐</button>
        </div>
        <div class="field-row">
          <span>截图帧数</span>
          <input id="screen-vision-frame-count" type="number" min="1" max="5" step="1" />
          <span>张</span>
        </div>
        <div class="button-grid">
          <button id="clear-screen-vision" type="button">清空屏幕印象</button>
        </div>
        <p id="desktop-context-note" class="detail-line">只在发送消息时临时附带。</p>
      </section>

      <section class="settings-section">
        <h2>资源</h2>
        <p id="resource-details" class="detail-line">Resources: Unknown</p>
        <div id="resource-metrics" class="metric-grid"></div>
        <div id="outfit-list" class="outfit-list"></div>
      </section>

      <section class="settings-section">
        <div class="section-heading-row">
          <h2>能力诊断</h2>
          <button id="refresh-diagnostics" type="button">刷新</button>
        </div>
        <p id="diagnostics-summary" class="detail-line">后端连接后会显示桌宠当前可用能力。</p>
        <div id="diagnostics-metrics" class="metric-grid"></div>
        <div id="diagnostics-tools" class="diagnostics-pill-row" aria-live="polite"></div>
      </section>

      <section class="settings-section">
        <h2>表情</h2>
        <div id="emotion-grid" class="emotion-grid"></div>
      </section>

      <section class="settings-section">
        <h2>调试</h2>
        <div class="toggle-grid">
          <label><input id="hit-test" type="checkbox" /> Hit-Test</label>
          <label><input id="hitbox-overlay" type="checkbox" /> Hitbox</label>
        </div>
        <div class="button-grid">
          <button id="toggle-webgl" type="button">WebGL</button>
          <button id="probe-click-through" type="button">穿透 5s</button>
          <button id="reset-window" type="button">重置位置</button>
          <button id="close-pet" class="danger-button" type="button">退出桌宠</button>
        </div>
      </section>

      <footer class="settings-footer">
        <span id="connection-status">Backend: Unknown</span>
        <span id="runtime-status">Ready</span>
      </footer>
    </main>
    <script type="module" src="/src/settings.js"></script>
  </body>
</html>
