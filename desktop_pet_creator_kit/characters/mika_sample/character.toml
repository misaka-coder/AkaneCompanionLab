schema_version = "akane.character.v0.1"

[identity]
id = "mika_sample"
name = "Mika"
app_name = "Mika Pet"
user_title = "店长"

[appearance]
default_outfit = "default"
default_emotion = "normal"
music_emotion = "listening"
required_emotions = ["normal"]
recommended_emotions = ["thinking", "happy", "confused", "listening", "proud", "sleepy"]

[dialogue]
input_placeholder = "和 Mika 说点什么……"
session_display_title = "Mika 桌宠对话"
tts_test_text = "Mika：语音播放测试。"
proactive_wake_prompt = "店长暂时没有说话。你像在工作台旁边陪他一样，参考刚才看见的内容自然接话。优先给出轻巧、具体、能继续推进的小建议；看不清时就温柔地问一句。"

[assets]
runtime_source = "sample character pack, with desktop_pet_next bundled fallback"
asset_root = "assets"
bundled_outfit = "default"
portrait_glob = "assets/characters/<outfit>/<emotion>.png"
