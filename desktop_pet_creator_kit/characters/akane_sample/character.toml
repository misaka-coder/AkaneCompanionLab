schema_version = "akane.character.v0.1"

[identity]
id = "akane_sample"
name = "Akane"
app_name = "Akane Next"
user_title = "主人"

[appearance]
default_outfit = "猫娘"
default_emotion = "正常"
music_emotion = "听歌中"
required_emotions = ["正常"]
recommended_emotions = [
  "思考中",
  "侧耳听",
  "听歌中",
  "困惑",
  "开心",
  "得意",
  "求摸摸",
  "被摸头",
  "困困",
  "打哈欠",
  "卖萌",
  "气鼓鼓",
  "无语",
  "偷吃被抓",
]

[dialogue]
input_placeholder = "和 Akane 说点什么……"
session_display_title = "Akane 桌宠对话"
tts_test_text = "Akane Next：语音播放测试。"
proactive_wake_prompt = "主人暂时没有说话。你像坐在旁边陪他一样，参考刚才看见的情况自然接话。"

[assets]
runtime_source = "character pack assets, with desktop_pet_next bundled fallback"
asset_root = "assets"
bundled_outfit = "猫娘"
portrait_glob = "assets/characters/<outfit>/<emotion>.png"
