name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-alpha:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop_pet_next/package-lock.json

      - name: Install desktop dependencies
        run: npm --prefix desktop_pet_next ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run canonical full verification
        shell: pwsh
        run: ./scripts/verify_akane.ps1 -Tier Full
