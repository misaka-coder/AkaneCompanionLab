[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akane-poke-streak"
version = "0.2.0"
description = "Akane SDK plugin example for repeated QQ poke awareness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["akane-plugin>=0.14,<0.15"]

[project.entry-points."akane.plugins.v1"]
"akane.sample.poke-streak" = "akane_poke_streak:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
