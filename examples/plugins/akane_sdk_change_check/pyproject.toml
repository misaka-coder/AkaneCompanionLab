[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "akane-sdk-change-check-example"
version = "0.1.0"
description = "An ordinary and background change check using result-level followup"
requires-python = ">=3.11"
dependencies = ["akane-plugin>=0.14,<0.15"]

[project.entry-points."akane.plugins.v1"]
"example.change-check" = "akane_sdk_change_check:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
