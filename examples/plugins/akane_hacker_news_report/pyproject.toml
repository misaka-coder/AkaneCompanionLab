[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akane-hacker-news-report"
version = "0.1.0"
description = "Akane read-only plugin example for Hacker News reports"
readme = "README.md"
requires-python = ">=3.11"

[project.entry-points."akane.plugins.v1"]
"akane.sample.hacker-news-report" = "akane_hacker_news_report:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
