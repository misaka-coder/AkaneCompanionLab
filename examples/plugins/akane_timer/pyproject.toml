[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akane-timer"
version = "0.2.0"
description = "Durable one-shot scheduled Agent events for Akane"
readme = "README.md"
requires-python = ">=3.11"

[project.entry-points."akane.plugins.v1"]
"akane.timer" = "akane_timer_plugin:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
