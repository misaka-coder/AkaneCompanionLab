[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akane-sdk-tts-tone"
version = "0.1.0"
description = "Deterministic audible tone fixture for TTS service replacement"
requires-python = ">=3.11"
dependencies = ["akane-plugin>=0.14,<0.15"]

[project.entry-points."akane.plugins.v1"]
"example.tts-tone" = "tts_tone:create_plugin"

[tool.setuptools.packages.find]
where = ["src"]
